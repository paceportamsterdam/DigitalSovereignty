<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVE report — TCS Active Sovereignty</title>
<style>
body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:radial-gradient(ellipse at 50% 20%,#1a2f6b,#0B1533 60%);color:#EAF0FF;min-height:100vh;text-align:center}
.w{max-width:520px;margin:auto;padding:28px 22px}.logos{display:flex;margin-bottom:22px}.logos img{height:34px}
img.hero{width:70%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #F2A33A}
.k{color:#F2A33A;letter-spacing:.2em;font-size:12px;font-weight:600;text-transform:uppercase;margin-bottom:14px}h1{font-size:26px;margin:.4em 0 .2em}p{color:#9FB0D6}
a.btn{box-sizing:border-box;display:block;width:100%;background:linear-gradient(90deg,#3366E0,#4f86ff);color:#fff;border-radius:999px;padding:16px;font-size:17px;font-weight:600;text-decoration:none;margin:18px 0}
.fn{font-size:13px;color:#BFD3F2}a.alt{color:#8fb0ff;font-size:13px}.foot{font-size:12px;color:#7d8db3;margin-top:30px}
</style></head><body><div class="w">
<div class="logos"><img src="../assets/tcs_white.png" alt="Tata Consultancy Services"></div>
<div class="k">Active Sovereignty · Executive report</div><img class="hero" id="hero" alt="">
<h1 id="t">The Minimum Viable Enterprise</h1><p id="s">Your executive MVE report</p>
<a class="btn" id="dl">Download the report (PDF)</a><div class="fn" id="fn"></div>
<div class="foot">Tata Consultancy Services · This page stores no personal data. <a class="alt" href="../privacy.html">Privacy notice</a></div></div>
<script src="../data.js"></script>
<script>
 const D=window.MVE,id=new URLSearchParams(location.search).get('m'),$=i=>document.getElementById(i);
 let M,C; D.clusters.forEach(c=>c.mves.forEach(m=>{if(m.id===id){M=m;C=c}}));
 if(!M){$('t').textContent='Report not found';$('s').textContent='Please scan the QR code again at the TCS stand.';$('dl').style.display='none';}
 else{document.title=M.file.replace('.pdf','');$('hero').src='../assets/'+M.img;$('t').textContent=M.short+' MVE';$('s').textContent='Ten-page executive report · '+C.name;
   const a=$('dl');a.href='../pdfs/'+encodeURIComponent(M.file);a.download=M.file;$('fn').textContent=M.file;}
</script></body></html>
